name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.21.2"

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks (checksum-verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "${base}/${archive}"
          curl -sSfL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o checksums.txt
          grep " ${archive}\$" checksums.txt | sha256sum -c -
          tar -xzf "${archive}" gitleaks

      - name: Scan working tree
        run: ./gitleaks dir . --config .gitleaks.toml --redact --no-banner

      # History before this workflow contains secrets that are being rotated
      # (docs/STALL_BOOKING_FINAL_SPEC.md §8.1); only new commits are gated here.
      - name: Scan commits in this pull request
        if: github.event_name == 'pull_request'
        run: >
          ./gitleaks git . --config .gitleaks.toml --redact --no-banner
          --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit

      - name: Start isolated test Postgres (localhost only, cluster_name=isf-test)
        run: |
          PG_BIN="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)"
          echo "PG_BIN=${PG_BIN}" >> "$GITHUB_ENV"
          PG_BIN="${PG_BIN}" node scripts/test-db.mjs start

      - name: Database and integration tests
        run: npm run test:db
        env:
          TEST_DATABASE_URL: postgresql://isf_test:isf_test@localhost:54329/isf_test

      - name: Inventory is valid and the committed seed is up to date
        run: |
          node scripts/inventory/cli.mjs validate ../docs/stall_inventory_provisional.csv
          node scripts/inventory/cli.mjs seed ../docs/stall_inventory_provisional.csv /tmp/seed.sql
          sed -i 's#^-- Source: .*#-- Source: (ignored)#' /tmp/seed.sql
          sed 's#^-- Source: .*#-- Source: (ignored)#' ../database/seeds/dev_stall_inventory_provisional.sql | diff - /tmp/seed.sql

      - name: Build
        run: npm run build

      - name: Browser tests (Playwright, bundled Chromium)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
        env:
          TEST_DATABASE_URL: postgresql://isf_test:isf_test@localhost:54329/isf_test
